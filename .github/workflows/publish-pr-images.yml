name: Verify and publish release images

on:
  push:
    tags:
      - 'release_v_*'

concurrency:
  group: publish-release-images-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" FETCH_HEAD; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit from main" >&2
            exit 1
          fi

  backend-tests:
    name: Test backend
    needs: validate-release-tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and package backend
        run: |
          chmod +x gradlew
          ./gradlew :vacation-sheet-service:clean :vacation-sheet-service:test :vacation-sheet-service:bootJar

  frontend-tests:
    name: Test frontend
    needs: validate-release-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacation-sheet-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vacation-sheet-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build

  publish-images:
    name: Publish ${{ matrix.image }}
    needs:
      - backend-tests
      - frontend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: vacation_sheet-service
            context: .
            dockerfile: vacation-sheet-service/Dockerfile
          - image: vacation_sheet-ui
            context: vacation-sheet-ui
            dockerfile: vacation-sheet-ui/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}

      # Examples: 
      #   - backend  - ghcr.io/kit-1414/vacation_sheet-service:release_v_1.2.3
      #   - frontend - ghcr.io/kit-1414/vacation_sheet-ui:release_v_1.2.3
      - name: Print image name
        run: echo "Publishing image ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
