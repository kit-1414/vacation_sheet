<mat-toolbar>
  <a class="brand" routerLink="/projects">Vacation Sheet</a>
  @if (auth.user()) {
    <nav aria-label="Основная навигация">
      <a mat-button routerLink="/projects" routerLinkActive="active">Проекты</a>
      <a mat-button routerLink="/users" routerLinkActive="active">Пользователи</a>
      <a mat-button routerLink="/profile" routerLinkActive="active">Личный кабинет</a>
    </nav>
  }
  <span class="toolbar-spacer"></span>
  @if (auth.user(); as user) {
    <span class="user-email">{{ user.email }}</span>
    <button mat-button type="button" (click)="auth.logout()">Выйти</button>
  }
</mat-toolbar>

@if (auth.loading()) {
  <main class="centered">
    <mat-spinner diameter="44" aria-label="Загрузка"></mat-spinner>
  </main>
} @else if (auth.user()) {
  <main class="workspace">
    <router-outlet />
  </main>
} @else {
  <main class="centered">
    <mat-card appearance="outlined" class="login-card">
      <mat-card-header>
        <mat-card-title>Учёт отпусков без лишних таблиц</mat-card-title>
        <mat-card-subtitle>Войдите в систему</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>Планируйте отпуска команды в одном понятном пространстве.</p>
      </mat-card-content>
      <mat-card-actions>
        <a mat-flat-button href="/login">Войти</a>
      </mat-card-actions>
    </mat-card>
  </main>
}
