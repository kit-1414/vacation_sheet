logging:
  level:
    com.example.vacationsheet: DEBUG

spring:
  application:
    name: vacation-sheet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vacation_sheet_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:replace-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID:replace-me}
            client-secret: ${YANDEX_CLIENT_SECRET:replace-me}
            redirect-uri: ${YANDEX_REDIRECT_URI:http://localhost:8055/login/oauth2/code/yandex}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope:
              - login:email
              - login:info
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info?format=json
            user-name-attribute: id

server:
  port: 8055

  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend:
    url: http://localhost:4200
  security:
    allowed-email-domain: ""
