services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vacation_sheet
      POSTGRES_USER: vacation_sheet
      POSTGRES_PASSWORD: vacation_sheet
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation_sheet -d vacation_sheet"]
      interval: 5s
      timeout: 3s
      retries: 10

  vacation-sheet-service:
    build:
      context: .
      dockerfile: vacation-sheet-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/vacation_sheet
      SPRING_DATASOURCE_USERNAME: vacation_sheet
      SPRING_DATASOURCE_PASSWORD: vacation_sheet
    ports:
      - "8055:8055"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8055/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  vacation-sheet-ui:
    build:
      context: vacation-sheet-ui
    ports:
      - "4200:80"
    depends_on:
      vacation-sheet-service:
        condition: service_healthy

volumes:
  postgres-data:
