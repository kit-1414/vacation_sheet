services:

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRESQL_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 5432:5432
    volumes:
      - ./docker-deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
      - postgres-data:/var/lib/postgresql/data:Z

  vacation-sheet-service:
    build:
      context: .
      dockerfile: vacation-sheet-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vacation_sheet_db
      SPRING_DATASOURCE_USERNAME: vacation_sheet
      SPRING_DATASOURCE_PASSWORD: vacation_sheet
    ports:
      - "8055:8055"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8055/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  vacation-sheet-ui:
    build:
      context: vacation-sheet-ui
    ports:
      - "4200:80"
    depends_on:
      vacation-sheet-service:
        condition: service_healthy

volumes:
  postgres-data:
