name: vacation-sheet

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacation_sheet_db}
      POSTGRES_USER: ${POSTGRES_USER:-vacation_sheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  vacation-sheet-service:
    image: ghcr.io/kit-1414/vacation_sheet-service:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vacation_sheet_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vacation_sheet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:?YANDEX_CLIENT_ID must be set}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:?YANDEX_CLIENT_SECRET must be set}
      YANDEX_REDIRECT_URI: ${APP_FRONTEND_URL:?APP_FRONTEND_URL must be set}/login/oauth2/code/yandex
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?APP_FRONTEND_URL must be set}
      APP_SECURITY_ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8055/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  vacation-sheet-ui:
    image: ghcr.io/kit-1414/vacation_sheet-ui:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      vacation-sheet-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
